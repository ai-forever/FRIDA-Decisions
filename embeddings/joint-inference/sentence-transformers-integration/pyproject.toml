[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-inference-sentence-transformers"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["joint-inference-core", "transformers>=5.2", "peft>=0.20", "sentence-transformers>=6.3", "Pillow", "torchvision"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
joint-inference-core = { path = "../core", editable = true }

[project.scripts]
joint-st-convert = "inference_plugins_sentence_transformers.convert:main"
