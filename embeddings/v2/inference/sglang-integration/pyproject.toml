[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-inference-sglang"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["joint-inference-core", "sglang"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
joint-inference-core = { path = "../core", editable = true }
