[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joint-inference-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.8", "safetensors>=0.4"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
